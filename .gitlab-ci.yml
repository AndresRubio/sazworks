# GitLab Pages: copies the static site into public/ on every push to the default branch.
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r index.html styles.css script.js favicon.svg favicon.ico assets es legal public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
